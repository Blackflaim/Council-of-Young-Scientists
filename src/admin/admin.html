<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="/src/admin/admin.css">

</head>

<body>

<div class="admin-layout">

<aside class="sidebar">

<h2>CMS</h2>

<nav>

<a href="#" class="active">
Новини
</a>

<a href="#">
Конкурси
</a>

<a href="#">
Гранти
</a>

</nav>

</aside>

<main class="dashboard">

<header class="dashboard-header">

<h1>
Керування новинами
</h1>

<div class="header-buttons">

<button id="openModal">
+ Додати новину
</button>

<button id="toggleDelete">
− Видалити новину
</button>

<button id="logoutBtn">
Logout
</button>

</div>

</header>

<section class="news-list"
id="newsList">

</section>

</main>

</div>

<div class="modal hidden"
id="modal">

<div class="modal-content">

<h2>Нова новина</h2>

<form id="newsForm">

<input
type="text"
id="title"
placeholder="Заголовок"
required>

<textarea
id="description"
placeholder="Опис новини"
required></textarea>

<textarea
id="content"
placeholder="Повний текст новини"
required>
</textarea>

<input
type="text"
id="image"
placeholder="URL картинки">

<button type="submit">
Зберегти
</button>

</form>

</div>

</div>

<script type="module"
src="/src/admin/admin.js"></script>

</body>
</html>
