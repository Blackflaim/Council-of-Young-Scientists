<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet"
href="/src/admin/admin.css">

</head>

<body>

<div class="login-page">

<div class="login-card">

<h1>
Admin Login
</h1>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<p id="error"></p>

</div>

</div>

<script
type="module"
src="/src/admin/login.js">
</script>

</body>
</html>
