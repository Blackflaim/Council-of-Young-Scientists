<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель | Рада молодих вчених</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <style>
        .admin-wrapper { max-width: 600px; margin: 60px auto; padding: 30px; background: var(--white); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--navy); font-size: 14px;}
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .lang-badge { display: inline-block; background: #e8ecf0; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 8px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="admin-wrapper" style="text-align: center; margin-top: 15vh;">
        <h2 style="margin-bottom: 20px; color: var(--navy);">Вхід для адміністратора</h2>
        <input type="password" id="adminPass" placeholder="Введіть пароль" style="padding: 12px; width: 80%; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 20px;">
        <br>
        <button id="loginBtn" class="btn-primary">Увійти</button>
    </div>

    <div id="adminPanel" class="admin-wrapper" style="display: none;">
        
        <div style="display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px;">
            <button id="tabAdd" class="btn-primary" style="flex: 1;">✏️ Додати новину</button>
            <button id="tabManage" class="btn-outline btn-dark" style="flex: 1;">🗑️ Управління</button>
        </div>

        <div id="sectionAdd">
            <h2 style="margin-bottom: 24px; color: var(--navy);">Нова публікація</h2>
            <form id="addNewsForm">
                <div class="form-group">
                    <label>Заголовок (UA) <span class="lang-badge">Обов'язково</span></label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label>Короткий опис (UA) <span class="lang-badge">Обов'язково</span></label>
                    <textarea id="description" required></textarea>
                </div>
                <div class="form-group">
                    <label>Повний текст (UA)</label>
                    <textarea id="content" required></textarea>
                </div>

                <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

                <div class="form-group">
                    <label>Title (EN) <span class="lang-badge">Опціонально</span></label>
                    <input type="text" id="title_en">
                </div>
                <div class="form-group">
                    <label>Description (EN) <span class="lang-badge">Опціонально</span></label>
                    <textarea id="description_en"></textarea>
                </div>
                <div class="form-group">
                    <label>Content (EN)</label>
                    <textarea id="content_en"></textarea>
                </div>

                <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

                <div class="form-group">
                    <label>Завантажити фото з комп'ютера</label>
                    <input type="file" id="imageFile" accept="image/*" style="background: #f8fafc; cursor: pointer;">
                </div>
                <div class="form-group">
                    <label>Або посилання на картинку</label>
                    <input type="text" id="image" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>Посилання на відео з YouTube або Facebook <span class="lang-badge">Опціонально</span></label>
                    <input type="text" id="videoUrl" placeholder="https://www.youtube.com/">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Опублікувати новину</button>
                <p id="statusMessage" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
            </form>
        </div>

        <div id="sectionManage" style="display: none;">
            <h2 style="margin-bottom: 24px; color: var(--navy);">Список існуючих новин</h2>
            <div id="adminNewsList" style="display: flex; flex-direction: column; gap: 15px;">
                </div>
        </div>

    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
